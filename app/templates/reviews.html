<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Delivery Review | FastShip</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31104b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 24px;
            text-decoration: none;
        }

        .logo span {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label.form-label {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            font-size: 32px;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #facc15;
            transform: scale(1.1);
        }

        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            color: #ffffff;
            resize: vertical;
            min-height: 100px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: #818cf8;
        }

        textarea::placeholder {
            color: #64748b;
        }

        .btn-submit {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.6);
        }

        .footer {
            margin-top: 32px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="logo">🚚 <span>FastShip</span></a>

        <h1>How was your delivery? ⭐</h1>
        <p class="subtitle">Your candid feedback helps us maintain top-quality doorstep delivery service.</p>

        <form method="post" action="{{ request_url or review_url }}">
            <div class="form-group">
                <label class="form-label" style="text-align: center;">Rate Your Experience</label>
                <div class="star-rating">
                    <input type="radio" name="rating" id="star5" value="5" checked>
                    <label for="star5" title="5 Stars">★</label>

                    <input type="radio" name="rating" id="star4" value="4">
                    <label for="star4" title="4 Stars">★</label>

                    <input type="radio" name="rating" id="star3" value="3">
                    <label for="star3" title="3 Stars">★</label>

                    <input type="radio" name="rating" id="star2" value="2">
                    <label for="star2" title="2 Stars">★</label>

                    <input type="radio" name="rating" id="star1" value="1">
                    <label for="star1" title="1 Star">★</label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Written Review (Optional)</label>
                <textarea name="comment" placeholder="Tell us about the delivery speed, packaging quality, or executive behavior..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Review →</button>
        </form>

        <div class="footer">
            &copy; 2026 FastShip Logistics. All rights reserved.
        </div>
    </div>

</body>
</html>
